unique_name: Customer Count-Order Retail445-PrevYearGrowthPct
object_type: metric_calc
label: Customer Count-Order Retail445-PrevYearGrowthPct
description: "Growth in percent of Customer Count-Order Retail445-PrevYear and Customer Count-Order Retail445-PrevYearGrowth versus the same period of the previous year."
expression: "CASE WHEN ISEMPTY([Measures].[Customer Count-Order Retail445-PrevYear])\
  \ THEN NULL \nELSE [Measures].[Customer Count-Order Retail445-PrevYearGrowth] /\
  \ [Measures].[Customer Count-Order Retail445-PrevYear] \nEND"
format: percent
