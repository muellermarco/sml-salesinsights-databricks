unique_name: Sales Amount SStdev-Order Retail445-YTDPrevYear
object_type: metric_calc
label: Sales Amount SStdev-Order Retail445-YTDPrevYear
description: 'Previous Year''s Year-to-date Sum of Sales '
expression: |-
  Avg(
    PeriodsToDate(
      [Order Date Dimension].[Order Retail445].[Order rpt_Year],
      ParallelPeriod(
        [Order Date Dimension].[Order Retail445].[Order rpt_Year],
        1,
        [Order Date Dimension].[Order Retail445].CurrentMember
      )
    ),
    [Measures].[salesamountsstdev1]
  )
format: "$#,##0.00"
