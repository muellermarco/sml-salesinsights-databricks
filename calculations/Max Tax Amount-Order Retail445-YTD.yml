unique_name: Max Tax Amount-Order Retail445-YTD
object_type: metric_calc
label: Max Tax Amount-Order Retail445-YTD
description: "Year-to-date Max Tax Amount (periods to date from the start of the year) along the Order Retail445 hierarchy of the Order Date Dimension."
expression: |-
  CASE
    WHEN ISEMPTY([Measures].[maxtaxamount1]) THEN NULL
    ELSE Aggregate(
           PeriodsToDate(
             [Order Date Dimension].[Order Retail445].[Order rpt_Year],
             [Order Date Dimension].[Order Retail445].CurrentMember
           ),
           [Measures].[maxtaxamount1]
         )
  END
format: "$#,##0.00"
