unique_name: Sales Amount-Order Retail445-YTD
object_type: metric_calc
label: Sales Amount-Order Retail445-YTD
description: Sales Amount Year-to-date Order Retail445
expression: |-
  CASE
    WHEN ISEMPTY([Measures].[salesamount1]) THEN NULL
    ELSE Aggregate(
           PeriodsToDate(
             [Order Date Dimension].[Order Retail445].[Order rpt_Year],
             [Order Date Dimension].[Order Retail445].CurrentMember
           ),
           [Measures].[salesamount1]
         )
  END
format: "$#,##0.00"
