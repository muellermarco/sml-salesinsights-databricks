unique_name: Max Tax Amount-Order Retail445-PrevYearGrowth
object_type: metric_calc
label: Max Tax Amount-Order Retail445-PrevYearGrowth
description: Parallel Period Sales Growth  Since the Previous Year
expression: |-
  CASE
    WHEN ISEMPTY([Measures].[Max Tax Amount-Order Retail445-PrevYear])
           or ISEMPTY(
             ([Order Date Dimension].[Order Retail445].CurrentMember, [Measures].[maxtaxamount1])
           )
    THEN NULL
    ELSE ([Order Date Dimension].[Order Retail445].CurrentMember, [Measures].[maxtaxamount1])
           - [Measures].[Max Tax Amount-Order Retail445-PrevYear]
  END
format: "$#,##0.00"
