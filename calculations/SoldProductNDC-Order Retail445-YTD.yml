unique_name: SoldProductNDC-Order Retail445-YTD
object_type: metric_calc
label: SoldProductNDC-Order Retail445-YTD
description: "Year-to-date SoldProductNDC (periods to date from the start of the year) along the Order Retail445 hierarchy of the Order Date Dimension."
expression: "CASE WHEN ISEMPTY([Measures].[soldproductNDC1]) THEN NULL \nELSE \nSum(PeriodsToDate([Order\
  \ Date Dimension].[Order Retail445].[Order rpt_Year], [Order Date Dimension].[Order\
  \ Retail445].CurrentMember), [Measures].[soldproductNDC1]) \nEND "
format: general number
