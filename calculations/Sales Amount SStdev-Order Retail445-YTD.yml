unique_name: Sales Amount SStdev-Order Retail445-YTD
object_type: metric_calc
label: Sales Amount SStdev-Order Retail445-YTD
description: Sales Amount Year-to-date Order Retail445
expression: |-
  CASE
    WHEN ISEMPTY([Measures].[salesamountsstdev1]) THEN NULL
    ELSE Avg(
           PeriodsToDate(
             [Order Date Dimension].[Order Retail445].[Order rpt_Year],
             [Order Date Dimension].[Order Retail445].CurrentMember
           ),
           [Measures].[salesamountsstdev1]
         )
  END
format: "$#,##0.00"
