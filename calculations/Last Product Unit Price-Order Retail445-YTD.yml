unique_name: Last Product Unit Price-Order Retail445-YTD
object_type: metric_calc
label: Last Product Unit Price-Order Retail445-YTD
description: "Year-to-date Last Product Unit Price (periods to date from the start of the year) along the Order Retail445 hierarchy of the Order Date Dimension."
expression: |-
  CASE
    WHEN ISEMPTY([Measures].[lastproductunitprice]) THEN NULL
    ELSE Avg(
           PeriodsToDate(
             [Order Date Dimension].[Order Retail445].[Order rpt_Year],
             [Order Date Dimension].[Order Retail445].CurrentMember
           ),
           [Measures].[lastproductunitprice]
         )
  END
format: "$#,##0.00"
