unique_name: Max Tax Amount-Order Retail445-PrevPeriodGrowth
object_type: metric_calc
label: Max Tax Amount-Order Retail445-PrevPeriodGrowth
description: Order Retail 445 Growth since previous period.
expression: |-
  CASE
    WHEN ISEMPTY([Measures].[Max Tax Amount-Order Retail445-Prev])
           OR ISEMPTY([Measures].[maxtaxamount1])
    THEN NULL
    ELSE ([Order Date Dimension].[Order Retail445].CurrentMember, [Measures].[maxtaxamount1])
           - [Measures].[Max Tax Amount-Order Retail445-Prev]
  END
format: "$#,##0.00"
