unique_name: Customer Count-Order Retail445-YTD
object_type: metric_calc
label: Customer Count-Order Retail445-YTD
description: "Year-to-date Customer Count (periods to date from the start of the year) along the Order Retail445 hierarchy of the Order Date Dimension."
expression: |-
  CASE
    WHEN ISEMPTY([Measures].[customercount1]) THEN NULL
    ELSE Avg(
           PeriodsToDate(
             [Order Date Dimension].[Order Retail445].[Order rpt_Year],
             [Order Date Dimension].[Order Retail445].CurrentMember
           ),
           [Measures].[customercount1]
         )
  END
format: general number
