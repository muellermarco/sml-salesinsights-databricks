unique_name: Internet Sales Simple
object_type: model
label: Internet Sales Simple
description: >-
  Copy of the Internet Sales model with a single, non-role-played date
  relationship (orderdatekey) to the simplified Date Dimension Simple.
dimensions:
  - Color Dimension
  - Size Dimension
  - Style Dimension
  - Weight Dimension
drillthroughs:
  - unique_name: Customer Details Simple
    attributes:
      - dimension: Customer Dimension
        name: Customer Name
      - dimension: Geography Dimension
        name: State
      - dimension: Geography Dimension
        name: Zip Code
      - dimension: Geography Dimension
        name: City
    metrics:
      - orderquantity1
      - salesamount1
  - unique_name: Shipping Details Simple
    attributes:
      - dimension: Color Dimension
        name: Color
      - dimension: Customer Dimension
        name: Customer Name
      - dimension: Size Dimension
        name: Size
      - dimension: Style Dimension
        name: Style
      - dimension: Product Dimension
        name: Product Name
    metrics:
      - orderquantity1
      - salesamount1
include_default_drillthrough: true
metrics:
  - unique_name: calculatedtax1
    folder: Sales Metrics
  - unique_name: customercount1
    folder: Customer Metrics
  - unique_name: customercountestimate1
    folder: Customer Metrics
  - unique_name: lastproductunitprice
    folder: Product Metrics
  - unique_name: maxOrderDate
    folder: Time Relative
  - unique_name: maxtaxamount1
    folder: Sales Metrics
  - unique_name: MinOrderDate
    folder: Time Relative
  - unique_name: orderquantity1
    folder: Sales Metrics
  - unique_name: salesamount1
    folder: Sales Metrics
  - unique_name: salesamountAvg1
    folder: Sales Metrics
  - unique_name: salesamountsstdev1
    folder: Sales Metrics
  - unique_name: soldproductNDC1
    folder: Sales Metrics
  - unique_name: Average Customer Count per Order
    folder: Time Relative
  - unique_name: Average Est Customer Count per Order
    folder: Time Relative
  - unique_name: Average Last Product Unit Count per Order
    folder: Time Relative
  - unique_name: Average Max Tax Count per Order
    folder: Time Relative
  - unique_name: Average Sales Amount SD Count per Order
    folder: Time Relative
  - unique_name: Average Sales per Order
    folder: Time Relative
  - unique_name: Average Sold Product per Order
    folder: Time Relative
perspectives:
  - unique_name: Internet Sales Simple - No PII
    dimensions:
      - hierarchies:
          - levels:
              - Customer Name
            name: Customer Hierarchy
        name: Customer Dimension
        secondaryattributes:
          - d_firstname
          - d_lastname
relationships:
  - unique_name: factinternetsales_Date_Dimension_Simple
    from:
      dataset: factinternetsales
      join_columns:
        - orderdatekey
    to:
      dimension: Date Dimension Simple
      level: DayMonth_simple
  - unique_name: factinternetsales_Order_Dimension
    from:
      dataset: factinternetsales
      join_columns:
        - salesorderlinenumber
        - salesordernumber
        - currencykey
    to:
      dimension: Order Dimension
      level: order_line_item
  - unique_name: factinternetsales_Product_Dimension
    from:
      dataset: factinternetsales
      join_columns:
        - productkey
    to:
      dimension: Product Dimension
      level: Product Name
  - unique_name: factinternetsales_Customer_Dimension
    from:
      dataset: factinternetsales
      join_columns:
        - customerkey
    to:
      dimension: Customer Dimension
      level: Customer Name
visible: true
